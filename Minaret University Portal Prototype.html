<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MUI Portal Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4F46E5;--pt:#fff;--b:#6366F1;--bg:#F8FAFC;--sf:#fff;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--ok:#DCFCE7;--okt:#166534;--wn:#FEF3C7;--wnt:#92400E;--er:#FEE2E2;--ert:#991B1B;--in:#E0E7FF;--int:#3730A3;--nu:#F1F5F9;--nut:#334155;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1120;--sf:#111A2E;--tx:#E2E8F0;--mu:#94A3B8;--bd:#24304A;--nu:#1E293B;--nut:#CBD5E1;--p:#818CF8;--pt:#0B1120}}
:root[data-theme=dark]{--bg:#0B1120;--sf:#111A2E;--tx:#E2E8F0;--mu:#94A3B8;--bd:#24304A;--nu:#1E293B;--nut:#CBD5E1;--p:#818CF8;--pt:#0B1120}
html,body{height:100%}body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700}
img.logo{background:none;object-fit:contain;border-radius:0}.sp{flex:1}.mu{color:var(--mu)}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav a{padding:8px 12px;border-radius:8px;color:var(--mu);cursor:pointer;white-space:nowrap;font-weight:500}nav a.on{background:var(--in);color:var(--int)}
@media(min-width:900px){.shell{display:grid;grid-template-columns:230px 1fr;align-items:start}nav{flex-direction:column;border-bottom:0;border-right:1px solid var(--bd);min-height:calc(100vh - 54px)}}
main{padding:16px;max-width:1100px;width:100%;box-sizing:border-box}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}.grid .card{margin:0}.grid b{display:block;font-size:24px}
.btn{background:var(--p);color:var(--pt);border:0;border-radius:8px;padding:10px 16px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;min-height:40px;margin:2px 4px 2px 0}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:#DC2626;color:#fff}.btn[disabled]{opacity:.5;cursor:not-allowed}
a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--b);outline-offset:2px}
input,select{height:40px;border:1px solid var(--bd);border-radius:8px;padding:0 10px;font:inherit;background:var(--sf);color:var(--tx);width:100%;box-sizing:border-box}
input[type=radio],input[type=checkbox]{width:auto;height:auto}label{display:block;font-weight:500;margin:8px 0 4px}label.i{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--ok);color:var(--okt)}.wn{background:var(--wn);color:var(--wnt)}.er{background:var(--er);color:var(--ert)}.in{background:var(--in);color:var(--int)}.nu{background:var(--nu);color:var(--nut)}
.bar{height:8px;background:var(--nu);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b);transition:width .3s}
.msg{color:var(--ert);font-weight:500;min-height:20px}.c{max-width:420px;margin:7vh auto;padding:0 16px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
#t{position:fixed;top:12px;right:12px;left:12px;max-width:380px;margin-left:auto;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:9}
.note{background:var(--wn);color:var(--wnt);padding:6px 16px;font-size:12px}
@media print{.top,nav,.note,.no{display:none}}
</style></head><body><div class="note">Design prototype with fictional data. Nothing is saved, emailed or charged.</div><div id="app"></div><div id="t" role="status" aria-live="polite" hidden></div>

stu:()=>`<h1>Students</h1><p class="mu">Change a status with the dropdown. It takes effect at once: suspended and withdrawn students cannot sign in, and every change is written to the audit log.</p><div class="card">${tb(['Matric number','Name','Programme','Level','Status','Change status'],S.studs.map((s,i)=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${bg(s[4])}</td><td><select aria-label="Change status for ${E(s[1])}" onchange="setSt(${i},this.value)">${['Active','Suspended','Deferred','Graduated','Withdrawn'].map(o=>`<option ${o==s[4]?'selected':''}>${o}</option>`).join('')}</select></td></tr>`).join(''))}</div>`,

function startPay(){let v=document.querySelector('[name=m]:checked').value,pv=document.querySelector('[name=pv]:checked').value,b=bal(),a=b;if(v=='p'){let s=$('#am').value.replace(/,/g,''),m=/^\d+(\.\d{1,2})?$/.exec(s);if(!m)return $('#e').textContent='Enter a valid amount with at most two decimals.';a=Math.round(parseFloat(s)*100)}if(a<100||a>b)return $('#e').textContent='Enter an amount from ₦1.00 up to '+N(b)+'.';
let p={ref:'MUI-'+rnd(6),rrr:pv=='Remita'?String(Math.random()).slice(2,14):'',prov:pv,amt:a,st:'Pending',me:1,who:S.u.n,d:today(),chk:0};S.pays.unshift(p);S.cur=p;S.po=0;L('Payment started',p.ref+' '+N(a));go('gw')}
